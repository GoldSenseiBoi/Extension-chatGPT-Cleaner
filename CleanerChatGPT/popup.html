<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CleanerChatGPT</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <h1>CleanerChatGPT</h1>
  <p>Welcome! Select the conversations you want to clean.</p>

  <!-- Champ pour coller manuellement le token -->
  <input id="token-input" type="text" placeholder="Colle ton token Bearer ici"
         style="width: 100%; margin-bottom: 6px; padding: 6px;" />
  <button id="save-token" style="margin-bottom: 6px;">Enregistrer le token</button>
  <button id="clear-token" style="margin-bottom: 12px;">Supprimer le token</button>

  <!-- Section compteur et boutons -->
  <div style="margin-bottom: 10px;">
    <button id="select-all-btn">Tout sélectionner</button>
    <button id="clear-selection-btn">Tout désélectionner</button>
    <span id="selected-count" style="margin-left: 10px; color: white;">0 sélectionnée</span>
  </div>

  <div id="conversation-list"></div>
  <button id="clean-button">Clean Selected</button>

  <script type="module" src="popup.js"></script>
</body>
</html>
