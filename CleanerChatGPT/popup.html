<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CleanerChatGPT</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <h1>CleanerChatGPT</h1>
  <p>Welcome! Select the conversations you want to clean.</p>

  <!-- Champ pour coller manuellement le token -->
  <input id="token-input" type="text" placeholder="Colle ton token Bearer ici"
         style="width: 100%; margin-bottom: 6px; padding: 6px;" />

  <!-- Boutons Enregistrer/Supprimer/Aide côte à côte -->
  <div class="button-group">
    <button id="save-token" class="white-button">Enregistrer le token</button>
    <button id="clear-token" class="white-button">Supprimer le token</button>
    <button id="help-button" class="white-button">Aide Token</button>
  </div>

  <!-- Boutons Tout sélectionner/Désélectionner côte à côte -->
  <div class="button-group">
    <button id="select-all-btn" class="white-button">Tout sélectionner</button>
    <button id="clear-selection-btn" class="white-button">Tout désélectionner</button>
  </div>
  <span id="selected-count" style="margin-left: 10px; color: white;">0 sélectionnée</span>

  <div id="conversation-list"></div>

  <!-- Bouton Clean Selected centré -->
  <div class="button-center">
    <button id="clean-button" class="gradient-button">Clean Selected</button>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
