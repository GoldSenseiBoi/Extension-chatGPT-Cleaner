<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CleanerChatGPT</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <h1>CleanerChatGPT</h1>
  <p>Welcome! Select the conversations you want to clean.</p>

  <!-- Field to manually paste the token -->
  <input id="token-input" type="text" placeholder="Paste your Bearer token here"
         style="width: 100%; margin-bottom: 6px; padding: 6px;" />

  <!-- Buttons Save/Delete/Help side by side -->
  <div class="button-group">
    <button id="save-token" class="white-button">Save Token</button>
    <button id="clear-token" class="white-button">Delete Token</button>
    <button id="help-button" class="white-button">Token Help</button>
  </div>

  <!-- Buttons Select All/Deselect All side by side -->
  <div class="button-group">
    <button id="select-all-btn" class="white-button">Select All</button>
    <button id="clear-selection-btn" class="white-button">Deselect All</button>
  </div>
  <span id="selected-count" style="margin-left: 10px; color: white;">0 selected</span>

  <div id="conversation-list"></div>

  <!-- Clean Selected button centered -->
  <div class="button-center">
    <button id="clean-button" class="gradient-button">Clean Selected</button>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
